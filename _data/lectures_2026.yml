# Lecture schedule for Fall 2026.
# Schema matches lectures_2025.yml:
# - date, title, slides, topics, readings
- date: 9/17
  title: >
    Week 1 <strong>Course Introduction</strong>
    <a href="AISE2026_Lecture-1.pdf">[slides]</a>
    <a href="https://ethz.zoom.us/rec/share/0JMHg45oA5Ozm5JWJvXICcYCjKv0MjGuhKPDNeXl2zCJUFOB0VmOHNvvZRKAq4Q1.bq4L15FYMq1lc-k2" target="_blank">[video]</a>
  slides:
  topics:
    - "Course logistics: no exam, project-based grading, tutorials as the core programming component"
    - "Scope: physics and engineering (majority of the course) plus a short module on chemistry and biology"
    - "Scientific method as PDE modeling: from natural phenomena to partial differential equations"
    - PDEs as a compact language of nature and a strong prior across physics, engineering, and beyond
    - "Why PDEs are hard to solve: few closed-form solutions and costly numerical methods"
    - Many-query tasks and the sim-to-real gap as motivation for combining PDE priors with data-driven AI
  readings:
    - <a href="https://www.nature.com/articles/s41586-023-06221-2">Scientific discovery in the age of artificial intelligence</a> <br/>
    - <a href="https://www.nature.com/articles/s42254-024-00712-5">Neural operators for accelerating scientific simulations and design</a> <br/>
    - <a href="https://www.nature.com/articles/s42254-021-00314-5">Physics-informed machine learning</a> <br/>

- date: 9/24
  title: >
    Week 2 <strong>Introduction to Deep Learning</strong>
    <a href="AISE2026_Lecture-2.pdf">[slides]</a>
    <a href="https://ethz.zoom.us/rec/share/XRG1Fd3wOOExamr_GPz3_2WURnpFmFeavp0XGiRo-Px-4uSg2LivAHD3OICZutD3.4t3Eelukj5Nc1Q8a" target="_blank">[video]</a>
  slides:
  topics:
    - "Learn PDE-modeled physics from data with neural networks"
    - "From McCulloch–Pitts and the perceptron to MLPs: affine maps, pointwise activations, and stacked layers"
    - "Universal approximation: an MLP can represent a continuous map, but the parameters still have to be found"
    - "Supervised learning: labeled data, training loss, and a validation set to check generalization"
    - "Training by gradient descent, backpropagation, and mini-batch SGD"
    - "Beyond dense MLPs: CNNs and other structured architectures for high-dimensional inputs"
  readings:
    - '<a href="https://arxiv.org/abs/1412.6980">Adam: A Method for Stochastic Optimization</a> <br/>'
    - <a href="https://en.wikipedia.org/wiki/Universal_approximation_theorem">Universal approximation theorem</a> <br/>
    - <a href="https://www.nature.com/articles/nature14539">Deep learning</a> <br/>

- date: 10/22
  title: >
    Week 3 <strong>Introduction to Physics-Informed Neural Networks 1</strong>
    <a href="AISE2026_Lecture-3.pdf">[slides]</a>
    <a href="https://ethz.zoom.us/rec/share/2bJxSCpyAZn9omRUKIDIKIjy_myedwu0cKm7fmT6DMcbr7StglgB9oKS4e2ogBJV.4gpHzMBLrtjE5d4B" target="_blank">[video]</a>
  slides:
  topics:
    - "PINNs solve a PDE without labeled data by minimizing interior, initial, and boundary residuals"
    - "Residuals use automatic differentiation and are trained on collocation points"
    - "Easy to implement, and high-dimensional heat and finance examples show only a mild growth of error with dimension"
    - "Forward problems include viscous conservation laws, incompressible Navier–Stokes, and dispersive PDEs such as KdV"
    - "A small amount of data can help, and the same loss handles data assimilation from partial measurements"
    - "The framework also covers radiative transfer, including inverse parameter identification"
  readings:
    - '<a href="https://www.sciencedirect.com/science/article/pii/S0021999118307125">Physics-informed neural networks: a deep learning framework for solving forward and inverse problems involving nonlinear partial differential equations</a> <br/>'
    - <a href="https://onlinelibrary.wiley.com/doi/abs/10.1002/cnm.1640100303">Neural-network-based approximations for solving partial differential equations</a> <br/>
    - <a href="https://ieeexplore.ieee.org/stamp/stamp.jsp?arnumber=712178">Artificial neural networks for solving ordinary and partial differential equations</a> <br/>
    - <a href="https://www.sciencedirect.com/science/article/pii/S0022407321001989">Physics-informed neural networks for simulating radiative transfer</a> <br/>
